<div class="col-lg-6 m-auto my-4 px-3">
  {{ERRORS}}
  <form method="post" action="course.php">
    <input type="hidden" name="action" value="{{ACTION}}">
    {{ID_FIELD}}
    <div class="card">
      <div class="card-header {{HEADER_CLASS}}">
        <h1 class="h3 text-white text-center mb-0">{{FORM_TITLE}}</h1>
      </div>
      <div class="card-body">
        <div class="mb-3">
          <label for="code" class="form-label">CODE (3-10 huruf/angka, contoh IK201):</label>
          <input type="text" id="code" name="code" class="form-control" maxlength="10" value="{{CODE}}" required>
        </div>
        <div class="mb-3">
          <label for="name" class="form-label">NAME:</label>
          <input type="text" id="name" name="name" class="form-control" maxlength="150" value="{{NAME}}" required>
        </div>
        <div class="mb-3">
          <label for="credits" class="form-label">CREDITS (1-6):</label>
          <input type="number" id="credits" name="credits" class="form-control" min="1" max="6" value="{{CREDITS}}" required>
        </div>
        <div class="mb-3">
          <label for="lecturer_id" class="form-label">LECTURER:</label>
          <select id="lecturer_id" name="lecturer_id" class="form-select">
            {{LECTURER_OPTIONS}}
          </select>
        </div>
        <button class="btn btn-success" type="submit">Submit</button>
        <a class="btn btn-info" href="course.php">Cancel</a>
      </div>
    </div>
  </form>
</div>
