<div class="col-lg-6 m-auto my-4 px-3">
  {{ERRORS}}
  <form method="post" action="index.php">
    <input type="hidden" name="action" value="{{ACTION}}">
    {{ID_FIELD}}
    <div class="card">
      <div class="card-header {{HEADER_CLASS}}">
        <h1 class="h3 text-white text-center mb-0">{{FORM_TITLE}}</h1>
      </div>
      <div class="card-body">
        <div class="mb-3">
          <label for="name" class="form-label">NAME:</label>
          <input type="text" id="name" name="name" class="form-control" maxlength="100" value="{{NAME}}" required>
        </div>
        <div class="mb-3">
          <label for="nidn" class="form-label">NIDN (10 digit angka):</label>
          <input type="text" id="nidn" name="nidn" class="form-control" maxlength="10" pattern="[0-9]{10}"
            inputmode="numeric" value="{{NIDN}}" required>
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label">PHONE:</label>
          <input type="tel" id="phone" name="phone" class="form-control" maxlength="20" value="{{PHONE}}" required>
        </div>
        <div class="mb-3">
          <label for="join_date" class="form-label">JOIN DATE:</label>
          <input type="date" id="join_date" name="join_date" class="form-control" value="{{JOIN_DATE}}" required>
        </div>
        <div class="mb-3">
          <label for="department_id" class="form-label">DEPARTMENT:</label>
          <select id="department_id" name="department_id" class="form-select">
            {{DEPARTMENT_OPTIONS}}
          </select>
        </div>
        <button class="btn btn-success" type="submit">Submit</button>
        <a class="btn btn-info" href="index.php">Cancel</a>
      </div>
    </div>
  </form>
</div>
